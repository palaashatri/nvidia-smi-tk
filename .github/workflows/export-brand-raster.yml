name: Render proposed brand assets
on:
  push:
    branches: [design/brand-identity-20261029]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cairosvg Pillow
      - run: python assets/brand/export.py
      - name: Export macOS icon
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root = Path('assets/brand/generated')
          Image.open(root/'app-icon-1024.png').save(root/'app-icon.icns', format='ICNS')
          PY
      - name: Commit reproducible raster assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/generated/
          if ! git diff --cached --quiet; then
            git commit -m "design: render native PNG ICO ICNS brand assets"
            git push origin HEAD:design/brand-identity-20261029
          fi
