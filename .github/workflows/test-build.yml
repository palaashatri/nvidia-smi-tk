name: Build Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-python:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Compile application and tests
        run: python -m compileall -q App.py config.py nvidia_smi.py ui tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  test-build-windows:
    needs: test-python
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and optional dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0

      - name: Build Windows executable
        run: pyinstaller --onefile --noconsole --name nvidia-smi-gui-monitor-test App.py

      - name: Verify Windows executable
        run: |
          if (Test-Path "dist/nvidia-smi-gui-monitor-test.exe") {
            Get-Item "dist/nvidia-smi-gui-monitor-test.exe" | Select-Object Name, Length
          } else {
            Write-Error "Windows build artifact was not created."
            exit 1
          }

  test-build-linux:
    needs: test-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tk on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install build and optional dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0

      - name: Build Linux executable
        run: pyinstaller --onefile --name nvidia-smi-gui-monitor-test App.py

      - name: Verify Linux executable
        run: test -f dist/nvidia-smi-gui-monitor-test
